services:
  database:
    image: postgres:16-alpine
    container_name: si_p2_database
    environment:
      POSTGRES_DB: si1
      POSTGRES_USER: alumnodb
      POSTGRES_PASSWORD: "1234"
    ports:
      - "9999:5432"
    volumes:
      - p2_database_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/populate.sql:/docker-entrypoint-initdb.d/02-populate.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumnodb -d si1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  p2_database_data:
